spring.application.name=pockets
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=initial_schema
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000
transaction.expiry-minutes=10
frontend.url=${FRONTEND_URL:http://localhost:5173}

pocket.reset.cron=0 0 2 * * *