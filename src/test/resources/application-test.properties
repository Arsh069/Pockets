spring.application.name=pockets-test
spring.config.import=optional:file:.env[.properties]

# Isolated test database (prevents tests from modifying real development data)
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway migrations for test DB
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=initial_schema
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000
transaction.expiry-minutes=10

pocket.reset.cron=0 0 2 * * *
